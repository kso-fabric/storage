server:
  servlet:
    context-path: /storage/v1

spring:
  application:
    name: storage
  datasource:
    url: jdbc:postgresql://localhost:5432/storage
    username: storage
    password: storage

  liquibase:
    enabled: true
    url: jdbc:postgresql://localhost:5432/storage
    user: storage_liquibase
    password: liquibase
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

cz:
  kso:
    fabric:
      storage:
        disc-root: "C:/Users/Jakub Anderle/IdeaProjects/storage/disc"
        integrity-batch-size: 100