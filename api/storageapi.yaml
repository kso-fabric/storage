openapi: 3.1.0
info:
  title: Storage API
  version: 0.1.2
  description: Fabric file storage service.
servers:
  - url: /storage-api/v1
security:
  - bearerAuth: [ ]
tags:
  - name: File
  - name: Directory
  - name: Storage
paths:
  /files:
    get:
      tags: [ File ]
      operationId: listFiles
      summary: List files in a directory
      parameters:
        - name: directoryId
          in: query
          description: Omit for root directory
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Directory contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ File ]
      operationId: uploadFile
      summary: Upload a file
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema: { type: string }
        - name: X-Directory-Id
          in: header
          schema: { type: string, format: uuid }
        - name: X-Content-SHA256
          in: header
          description: Expected SHA-256 checksum in hexadecimal
          schema: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        - name: X-Content-Type
          in: header
          description: File Content-Type
          schema: { type: string, example: "image/x-canon-cr2" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMetadata" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: File exceeds allowed size }
        "422": { description: Checksum mismatch }
        "507": { description: Insufficient storage space }
  /files/{id}:
    parameters:
      - { $ref: "#/components/parameters/FileId" }
    get:
      tags: [ File ]
      operationId: getFile
      summary: Get file metadata
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMetadata" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [ File ]
      operationId: updateFile
      summary: Rename or move a file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItemRequest" }
      responses:
        "200":
          description: Updated file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMetadata" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [ File ]
      operationId: deleteFile
      summary: Delete a file
      responses:
        "204": { description: File deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /files/{id}/content:
    parameters:
      - { $ref: "#/components/parameters/FileId" }
    get:
      tags: [ File ]
      operationId: downloadFile
      summary: Download file content
      responses:
        "200":
          description: |
            File content.
            The Content-Type header contains the stored MIME type
            of the file, or application/octet-stream if unknown.
          headers:
            Content-Disposition:
              description: Original filename
              schema:
                type: string
            Content-Length:
              description: File size in bytes
              schema:
                type: integer
                format: int64
            Content-Digest:
              description: SHA-256 digest (RFC 9530)
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [ File ]
      operationId: updateFileContent
      summary: Update file content
      parameters:
        - name: X-Content-SHA256
          in: header
          description: Expected SHA-256 checksum in hexadecimal
          schema: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        - name: X-Content-Type
          in: header
          description: File Content-Type
          schema: { type: string, example: "image/x-canon-cr2" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: File content replaced successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: File exceeds allowed size
        "422":
          description: Checksum mismatch
        "507":
          description: Insufficient storage space
  /directories:
    get:
      tags: [ Directory ]
      operationId: listDirectory
      summary: List directories in a directory
      parameters:
        - name: directoryId
          in: query
          description: Omit for root directory
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Directory contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryListResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ Directory ]
      operationId: createDirectory
      summary: Create a directory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDirectoryRequest" }
      responses:
        "201":
          description: Directory created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryMetadata" }
        "409": { $ref: "#/components/responses/Conflict" }
  /directories/{id}:
    parameters:
      - { $ref: "#/components/parameters/DirectoryId" }
    get:
      tags: [ Directory ]
      operationId: getDirectory
      summary: Get directory metadata
      responses:
        "200":
          description: Directory metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryMetadata" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [ Directory ]
      operationId: updateDirectory
      summary: Rename or move a directory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItemRequest" }
      responses:
        "200":
          description: Updated directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryMetadata" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [ Directory ]
      operationId: deleteDirectory
      summary: Delete a directory
      parameters:
        - name: recursive
          in: query
          required: false
          description: Recursively delete directory contents
          schema:
            type: boolean
            default: false
      responses:
        "204": { description: Directory deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Directory is not empty and recursive is on }
  /storage:
    get:
      tags: [ Storage ]
      operationId: getStorageInfo
      summary: Get storage capacity and usage
      responses:
        "200":
          description: Storage information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageInfo" }
  /storage/integrity:
    get:
      tags:
        - Storage
      operationId: getStorageIntegrity
      summary: Check storage integrity
      description: |
        Performs a full scan of the storage directory and compares
        physical files with database records.

        This operation may be slow for large storage volumes.
        File checksums are not recalculated.
        No files or database records are modified.
      responses:
        '200':
          description: Storage integrity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageIntegrity'
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    FileId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DirectoryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Metadata:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        custom:
          type: object
          additionalProperties: true
    FileMetadata:
      type: object
      required: [ id, name, size, checksum, createdAt ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        directoryId: { type: string, format: uuid }
        size: { type: integer, format: int64 }
        contentType: { type: string }
        checksum: { type: string, description: SHA-256 checksum in hexadecimal }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        additionalData:
          $ref: "#/components/schemas/Metadata"
          description: Arbitrary JSON metadata associated with the file.
    FileListResponse:
      type: object
      required: [ files, total ]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/FileMetadata" }
        total: { type: integer, format: int64 }
    UpdateItemRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: [ string, "null" ]
          minLength: 1
        directoryId:
          type: [ string, "null" ]
          format: uuid
        additionalData:
          oneOf:
            - $ref: "#/components/schemas/UpdateMetadataRequest"
            - type: "null"
    UpdateMetadataRequest:
      type: object
      minProperties: 1
      properties:
        description:
          type: [ string, "null" ]
          maxLength: 2000
        tags:
          type: array
          items:
            $ref: '#/components/schemas/UpdateTagItem'
        custom:
          type: [ object, "null" ]
          additionalProperties: true
    UpdateTagItem:
      type: object
      required: [ value, action ]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 100
        action:
          type: string
          enum: [ ADD, DELETE ]
    CreateDirectoryRequest:
      type: object
      required: [ name ]
      properties:
        name: { type: string, minLength: 1 }
        parentId: { type: string, format: uuid }
    DirectoryMetadata:
      type: object
      required: [ id, name, createdAt ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        additionalData:
          $ref: "#/components/schemas/Metadata"
          description: Arbitrary JSON metadata associated with the directory.
    DirectoryListResponse:
      type: object
      required: [ directories, total ]
      properties:
        directories:
          type: array
          items: { $ref: "#/components/schemas/DirectoryMetadata" }
        total: { type: integer, format: int64 }
    StorageInfo:
      type: object
      required: [ managedBytes, usedBytes, usableBytes, unallocatedBytes, totalBytes ]
      properties:
        managedBytes:
          description: 'Total logical size of files managed by Storage'
          type: integer
          format: int64
        usedBytes:
          description: 'Total allocated space on the filesystem'
          type: integer
          format: int64
        usableBytes:
          description: 'Space available to the Storage process'
          type: integer
          format: int64
        unallocatedBytes:
          description: 'Total unallocated space on the filesystem'
          type: integer
          format: int64
        blockSize:
          description: 'Filesystem block size in bytes'
          type: integer
          format: int64
        totalBytes:
          description: 'Total filesystem capacity in bytes'
          type: integer
          format: int64
    StorageIntegrity:
      type: object
      required:
        - databaseFiles
        - diskFiles
        - missingFiles
        - orphanedFiles
        - sizeMismatches
        - databaseBytes
        - diskBytes
      properties:
        databaseFiles:
          type: integer
          format: int64
          description: Number of files registered in the database
        diskFiles:
          type: integer
          format: int64
          description: Number of regular files found in the storage directory
        missingFiles:
          type: integer
          format: int64
          description: Number of database files missing from disk
        orphanedFiles:
          type: integer
          format: int64
          description: Number of disk files without a database record
        sizeMismatches:
          type: integer
          format: int64
          description: Number of files whose actual size differs from the database
        databaseBytes:
          type: integer
          format: int64
          description: Sum of file sizes registered in the database
        diskBytes:
          type: integer
          format: int64
          description: Sum of actual file sizes found on disk
    ErrorResponse:
      type: object
      required: [ title, status, detail ]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
